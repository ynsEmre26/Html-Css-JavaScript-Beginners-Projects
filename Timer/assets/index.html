<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Timer</title>
  </head>
  <body>
    <header>
      <div class="container">
        <h1 class="title">Never Give Up!</h1>
        <div class="content">
          <div class="months-c">
            <p class="text" id="months">0</p>
            <span>months</span>
          </div>
          <div class="days-c">
            <p class="text" id="days">0</p>
            <span>days</span>
          </div>
          <div class="hours-c">
            <p class="text" id="hours">0</p>
            <span>hours</span>
          </div>
          <div class="minutes-c">
            <p class="text" id="minutes">0</p>
            <span>minutes</span>
          </div>
          <div class="seconds-c">
            <p class="text" id="seconds">0</p>
            <span>seconds</span>
          </div>
        </div>
      </div>
    </header>
    <script src="script.js"></script>
  </body>
</html>
